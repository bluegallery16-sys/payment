<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Payment</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f4f5f7;
            font-family: Arial, sans-serif;
        }

        .payment-box {
            width: 90%;
            max-width: 380px;
            background: white;
            padding: 30px 25px;
            border-radius: 18px;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0,0,0,0.10);
        }

        .icon {
            width: 65px;
            height: 65px;
            margin: 0 auto 15px;
            border-radius: 50%;
            background: #5f259f;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            font-weight: bold;
        }

        h2 {
            margin: 10px 0;
            color: #222;
        }

        .amount {
            font-size: 34px;
            font-weight: bold;
            color: #111;
            margin: 20px 0;
        }

        .info {
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .pay-button {
            display: block;
            width: 100%;
            padding: 15px;
            background: #5f259f;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-size: 17px;
            font-weight: bold;
        }

        .pay-button:active {
            transform: scale(0.98);
        }

        .note {
            margin-top: 15px;
            font-size: 12px;
            color: #888;
            line-height: 1.5;
        }
    </style>
</head>

<body>

    <div class="payment-box">

        <div class="icon">BOG</div>

        <h2>Update Request</h2>

        <div class="amount">
            9,999
        </div>

        <div class="info">
            Service permission.
        </div>

        <a id="payButton" class="pay-button" href="#">
            Code 9,999
        </a>

       
    </div>


    <script>

        /*
         * ==================================
         * PAYMENT DETAILS
         * ==================================
         *
         * YAHAN APNI UPI ID DAALO
         */

        const UPI_ID = "blueoriginpaymentclearance@ybl";

        /*
         * Payment screen par dikhne wala naam
         */

        const PAYEE_NAME = "BLUE ORIGIN ";

        /*
         * FIXED PAYMENT AMOUNT
         */

        const AMOUNT = "9999";


        /*
         * ==================================
         * UPI PAYMENT LINK
         * ==================================
         */

        const upiLink =
            "upi://pay" +
            "?pa=" + encodeURIComponent(UPI_ID) +
            "&pn=" + encodeURIComponent(PAYEE_NAME) +
            "&am=" + AMOUNT +
            "&cu=INR";


        /*
         * BUTTON KO UPI LINK SE CONNECT KARNA
         */

        document.getElementById("payButton").href = upiLink;

    </script>

</body>
</html>
